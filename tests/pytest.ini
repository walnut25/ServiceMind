[pytest]
minversion = 8.0
testpaths = unit api ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    unit: framework unit tests; no backend, database or browser required
    api: black-box HTTP tests against the running backend
    ui: Playwright browser tests against the running frontend
    smoke: fast subset that proves the critical path end to end
    regression: the full business regression suite
    security: authorization/authentication boundary tests
    slow: tests that intentionally take longer (e.g. expiry handling)
log_cli = false
log_cli_level = INFO
