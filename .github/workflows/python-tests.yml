name: python-automation-tests

# Independent workflow: the existing ci.yml (Maven, frontend, container builds)
# is untouched, so a failing UI job can never hide the backend results.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # A per-run project name isolates containers and the MySQL volume, so an old
  # admin password or leftover rows can never influence this run.
  COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}
  MYSQL_PORT: "3307"
  SERVER_PORT: "8081"
  JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
  JWT_ACCESS_TOKEN_TTL: 30m
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: Admin123!
  AI_CHAT_ENABLED: "false"
  QA_RUN_ID: ci${{ github.run_id }}

jobs:
  python-unit-test:
    name: Framework unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run framework unit tests
        run: pytest tests/unit -q --alluredir=allure-results-unit

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: allure-results-unit/
          retention-days: 7

  python-api-test:
    name: API automation (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Build the backend image
        run: docker compose build app

      - name: Start MySQL and the backend
        run: docker compose up -d mysql app

      - name: Wait for the backend health endpoint
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:8081/actuator/health" | grep -q '"status":"UP"'; then
              echo "backend is UP"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"
          docker compose ps
          docker compose logs --no-color --tail=200 app mysql
          exit 1

      - name: Run API tests
        run: pytest tests/api -q --alluredir=allure-results
        env:
          API_BASE_URL: http://127.0.0.1:8081
          DB_HOST: 127.0.0.1
          DB_PORT: "3307"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: tests/reports/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 app mysql

      - name: Tear down
        if: always()
        run: docker compose down -v

  python-ui-test:
    name: UI automation (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the backend image
        run: docker compose build app

      - name: Start MySQL and the backend
        run: docker compose up -d mysql app

      - name: Wait for the backend health endpoint
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:8081/actuator/health" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color --tail=200 app
          exit 1

      - name: Run UI tests
        run: pytest tests/ui -q --alluredir=allure-results-ui
        env:
          API_BASE_URL: http://127.0.0.1:8081
          FRONTEND_DIST: frontend/dist
          # empty -> use Playwright's bundled Chromium instead of a system browser
          UI_BROWSER_CHANNEL: ""
          UI_HEADLESS: "true"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui/
          retention-days: 7

      - name: Upload failure screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-artifacts
          path: |
            tests/reports/screenshots/
            tests/reports/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 app mysql

      - name: Tear down
        if: always()
        run: docker compose down -v
